<style>
:root{--paper:#FAF9F7;--ink:#1A1917;--muted:#6E6C68;--line:#E6E4E0;--white:#FFFFFF;
--sans:"Onest",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#000;--ink:#F5F5F2;--muted:#A1A09B;--line:#272727;--white:#1F1F1F}}
:root[data-theme=dark]{color-scheme:dark;--paper:#000;--ink:#F5F5F2;--muted:#A1A09B;--line:#272727;--white:#1F1F1F}
:root[data-theme=light]{color-scheme:light}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;font:400 16px/24px var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:8px}
a{color:var(--ink)}
header,footer{width:100%;max-width:1200px;margin:0 auto;padding:20px 16px}
header a{display:inline-block;line-height:0}
.wm{height:24px;width:auto}
.wm-paper,.icon.ic-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .wm-ink,:root:not([data-theme=light]) .ic-light{display:none}:root:not([data-theme=light]) .wm-paper{display:block}:root:not([data-theme=light]) .ic-dark{display:block}}
:root[data-theme=dark] .wm-ink,:root[data-theme=dark] .ic-light{display:none}:root[data-theme=dark] .wm-paper,:root[data-theme=dark] .ic-dark{display:block}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px 48px}
.card{width:100%;max-width:480px;background:var(--white);border:1px solid var(--line);border-radius:24px;padding:32px 24px;text-align:center}
.icon{display:block;width:88px;height:88px;border-radius:20px;margin:0 auto 20px;box-shadow:0 8px 28px rgba(20,20,19,.14)}
.label{font:500 12px/16px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font-size:clamp(32px,9vw,44px);line-height:1.05;letter-spacing:-.04em;font-weight:700;margin-bottom:12px;text-wrap:balance}
.lead{color:var(--muted);margin-bottom:24px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:12px 24px;border-radius:9999px;background:var(--ink);color:var(--paper);font:600 16px/24px var(--sans);text-decoration:none;transition:opacity .3s,transform .3s}
.btn:hover{opacity:.86}.btn:active{transform:scale(.98)}
.meta{font:400 12px/16px var(--mono);color:var(--muted);margin-top:10px}
.after{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);text-align:left}
.after h2{font:500 12px/16px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
ol{list-style:none;counter-reset:s}
li{counter-increment:s;display:flex;gap:12px;padding:6px 0}
li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);font:500 12px/22px var(--mono);text-align:center;color:var(--muted)}
.back{display:inline-block;margin-top:24px;font-size:14px;color:var(--muted)}
.back:hover{color:var(--ink)}
footer{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
footer a{color:var(--muted)}
@media (min-width:768px){.card{padding:40px}header,footer{padding:20px 24px}}
</style>
<script src="/assets/dl.js" defer></script>
</head>
